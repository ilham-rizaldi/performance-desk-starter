<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Performance Desk Starter</title>
  <link rel="stylesheet" href="styles.css">
  <script src="data.js" defer></script>
  <script src="panels.js" defer></script>
  <script src="dashboard.js" defer></script>
  <script src="connections.js" defer></script>
</head>
<body>
  <header class="bar"><div class="frame header-row">
    <a class="brand" href="./">Performance Desk</a>
    <nav aria-label="Dashboard views">
      <button type="button" data-view="daily" aria-current="page">Daily</button>
      <button type="button" data-view="trends">Trends</button>
      <button type="button" data-view="benchmarks">Benchmarks</button>
      <button type="button" data-view="predictions">Predictions</button>
      <button type="button" data-view="plan">Plan</button>
      <button type="button" data-view="archive">Archive</button>
      <button type="button" data-view="reference">Reference</button>
    </nav>
    <button type="button" id="show-connections">Connect accounts</button>
    <label class="import">Open report file <input type="file" id="report-input" accept=".json,application/json"></label>
  </div></header>
  <main class="frame">
    <div id="feedback" role="status" aria-live="polite"></div>
    <section id="daily" aria-labelledby="daily-title">
      <div class="page-heading"><h1 id="daily-title">Daily</h1><span id="report-date"></span></div>
      <div id="daily-content"></div>
    </section>
    <section id="trends" aria-labelledby="trends-title" hidden>
      <div class="page-heading"><h1 id="trends-title">Trends</h1></div>
      <div id="trends-content"></div>
    </section>
    <section id="predictions" aria-labelledby="predictions-title" hidden>
      <div class="page-heading"><h1 id="predictions-title">Performance predictions</h1></div>
      <div id="predictions-content"></div>
    </section>
    <section id="benchmarks" aria-labelledby="benchmarks-title" hidden>
      <div class="page-heading"><h1 id="benchmarks-title">Benchmarks</h1></div><div id="benchmarks-content"></div>
    </section>
    <section id="plan" aria-labelledby="plan-title" hidden>
      <div class="page-heading"><h1 id="plan-title">Plan</h1></div><div id="plan-content"></div>
    </section>
    <section id="archive" aria-labelledby="archive-title" hidden>
      <div class="page-heading"><h1 id="archive-title">Archive</h1></div><div id="archive-content"></div>
    </section>
    <section id="reference" aria-labelledby="reference-title" hidden>
      <div class="page-heading"><h1 id="reference-title">Reference</h1></div><div id="reference-content"></div>
    </section>
  </main>
  <dialog id="details" aria-labelledby="detail-title">
    <div class="dialog-head"><h2 id="detail-title"></h2><form method="dialog"><button>Close</button></form></div>
    <div id="detail-content"></div>
  </dialog>
  <dialog id="connections" aria-labelledby="connections-title">
    <div class="dialog-head"><h2 id="connections-title">Data connections</h2><form method="dialog"><button>Close</button></form></div>
    <div id="connection-cards" class="stack"></div>
    <p id="connection-status" role="status" aria-live="polite"></p>
    <form id="key-form" class="stack" hidden>
      <a target="_blank" rel="noreferrer">Open provider settings</a>
      <label for="source-key" id="key-label"></label>
      <input id="source-key" type="password" autocomplete="off" required maxlength="512" />
      <button>Connect and sync</button>
    </form>
    <button id="sync-now" type="button" hidden>Sync now</button>
  </dialog>
  <noscript>Turn on JavaScript to open a report file in this browser.</noscript>
</body>
</html>
